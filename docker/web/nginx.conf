server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm application/octet-stream;
    gzip_min_length 1024;

    # Blazor WASM — all routes fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static Blazor assets
    location ~* \.(js|wasm|dll|blat|br|gz|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache index.html or config.json
    location ~* (index\.html|config\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
