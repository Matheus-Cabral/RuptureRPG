server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm application/octet-stream;
    gzip_min_length 1024;

    # Blazor WASM — all routes fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blazor's compiled framework/app assemblies, wasm, and boot manifest — this SDK does not
    # content-hash these filenames (confirmed: same name every build, e.g. Ruptura.Web.wasm),
    # so a far-future "immutable" Cache-Control here means any cache sitting in front of a
    # visitor (their browser, or an edge/CDN proxy such as Cloudflare) that already holds a
    # pre-deploy copy keeps serving those exact stale bytes for up to a year and never
    # re-checks. blazor.boot.json is always revalidated (it isn't matched by any long-cache
    # rule) and carries a fresh SRI hash after every deploy, computed against the NEW build —
    # so a stale cached _framework file no longer matches it and the browser hard-fails the
    # whole app load with a subresource-integrity error instead of just showing old content.
    # This shipped once in production after a routine redeploy. Short-lived caching here
    # trades a little repeat-visit performance for "every redeploy actually reaches every
    # visitor" — the `^~` prefix match makes this win over the regex rule below for anything
    # under this path regardless of extension (.wasm/.dll/.js/.blat/.br/.gz/.pdb.gz/...).
    location ^~ /_framework/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache static assets that ARE safe to cache aggressively — these aren't part of the
    # SRI-checked boot manifest, so staleness here is cosmetic (an old icon/font/stylesheet
    # for a while), never a hard failure.
    location ~* \.(css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache index.html or config.json
    location ~* (index\.html|config\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
