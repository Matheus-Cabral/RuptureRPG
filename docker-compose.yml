services:
  db:
    image: postgres:16-alpine
    container_name: ruptura_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: ruptura_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: >
        Host=db;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_EXPIRY_MINUTES}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_EXPIRY_DAYS}
      Cors__AllowedOrigin: ${CORS_ALLOWED_ORIGIN}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    ports:
      - "${API_PORT}:5000"
    volumes:
      - api_logs:/app/logs

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: ruptura_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: ${API_BASE_URL}
    ports:
      - "${WEB_PORT}:80"

volumes:
  postgres_data:
  api_logs:
